name: CI

# Billing throttle (2026-10-03): PR pushes run once via pull_request; push
# triggers only main. Docs-only changes skip CI entirely. This also removes
# the push+pull_request double run that produced the #41 openapi merge-preview
# hybrid (the auto-merged file neither side would export).
on:
  push:
    branches: [main]
    paths-ignore:
      - "AGENT_CONTEXT/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "AGENT_CONTEXT/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Local-set environment: CI is a test context, so the strong-secret
      # guard stays permissive there and the real guards run at deploy time.
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://agenthu:agenthu@127.0.0.1:5432/agenthu
      TEST_DATABASE_URL: postgresql+psycopg://agenthu:agenthu@127.0.0.1:5432/agenthu_test
      REDIS_URL: redis://127.0.0.1:6379/0
      STORAGE_BACKEND: memory
      SECRET_KEY: ci-test-secret-key-not-for-production
      # S3-compatible store used by the `-m storage` test.
      S3_ENDPOINT_URL: http://127.0.0.1:9090
      S3_ACCESS_KEY: agenthu
      S3_SECRET_KEY: agenthu123
      S3_BUCKET: agenthu
      S3_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # The upstream `minio/minio` image is unavailable (Docker Hub 404), so CI
      # uses the `s3mock` profile instead. The Backend only depends on the
      # ObjectStorage interface, so no application change is required.
      - name: Start backing services
        run: docker compose --profile s3mock up -d db redis s3mock

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T db pg_isready -U agenthu -d agenthu && exit 0
            sleep 2
          done
          echo "PostgreSQL did not become ready" && exit 1

      - name: Wait for S3Mock
        run: |
          for i in $(seq 1 30); do
            # /favicon.ico is S3Mock's readiness endpoint; the root path is an
            # unauthenticated ListBuckets that may return 403.
            curl -sf http://127.0.0.1:9090/favicon.ico >/dev/null && exit 0
            sleep 2
          done
          echo "S3Mock did not become ready" && exit 1

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pyright
        run: pyright

      - name: Apply migrations from zero
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      # Fail fast when the committed `openapi.json` is stale or the shared client
      # contract (`packages/contracts`, snapshot in `tests/fixtures/client_contract.ts`)
      # no longer matches the Backend schemas. Must run *before* the export step,
      # otherwise the artifact is regenerated and drift is masked. `--require-zod`
      # makes a missing Zod source a hard failure: the frozen snapshot must
      # always exist, so the check can never silently degrade to OpenAPI-only.
      - name: Check OpenAPI / client contract drift
        run: python -m backend.scripts.check_contract_drift --require-zod

      - name: Export OpenAPI contract
        run: python -m backend.scripts.export_openapi --output openapi.json

      - name: Run tests
        run: pytest

  pip-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Audits the fully resolved environment (pip install -e ".[dev]"), not
      # just declared ranges. Known-but-accepted findings can be waived with
      # `--ignore-vuln <ID>` plus a justification comment here; the bar for a
      # waiver is: dev-only dependency, not shipped in the runtime image, with
      # an upstream fix pending. (No waivers needed today.)
      - name: Install dependencies and audit
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/pip install pip-audit
          .venv/bin/pip-audit

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Build-only validation so Dockerfile drift (base image, layer order,
      # copied files) fails CI instead of surfacing on the next deploy. The
      # image is intentionally not pushed.
      - name: Build Backend image
        run: docker build --tag agenthu-backend:ci .

  compose-smoke:
    name: Compose smoke (api + worker healthy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Terminal check for the compose stack: build the images, boot db/redis/
      # s3mock/api/worker with the CI override, and hold until every service
      # reports healthy (`--wait` fails on any unhealthy service). api applies
      # migrations in its command before uvicorn starts, so /health/ready
      # proving db + object storage closes the old manual "compose healthy"
      # handoff for good. Budget: image build ~2-4 min + api start_period 30s
      # + worker first heartbeat <=30s.
      - name: Bring up the stack and wait for health
        run: >
          docker compose -f docker-compose.yml -f docker-compose.ci-smoke.yml
          --profile s3mock up -d --wait db redis s3mock api worker

      - name: Smoke-check the API readiness endpoint
        run: curl -fsS http://127.0.0.1:8000/health/ready

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci-smoke.yml down -v
