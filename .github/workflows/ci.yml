name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: postgresql+psycopg://agenthu:agenthu@127.0.0.1:5432/agenthu
      TEST_DATABASE_URL: postgresql+psycopg://agenthu:agenthu@127.0.0.1:5432/agenthu_test
      REDIS_URL: redis://127.0.0.1:6379/0
      STORAGE_BACKEND: memory
      SECRET_KEY: ci-test-secret-key-not-for-production
      # S3-compatible store used by the `-m storage` test.
      S3_ENDPOINT_URL: http://127.0.0.1:9090
      S3_ACCESS_KEY: agenthu
      S3_SECRET_KEY: agenthu123
      S3_BUCKET: agenthu
      S3_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # The upstream `minio/minio` image is unavailable (Docker Hub 404), so CI
      # uses the `s3mock` profile instead. The Backend only depends on the
      # ObjectStorage interface, so no application change is required.
      - name: Start backing services
        run: docker compose --profile s3mock up -d db redis s3mock

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T db pg_isready -U agenthu -d agenthu && exit 0
            sleep 2
          done
          echo "PostgreSQL did not become ready" && exit 1

      - name: Wait for S3Mock
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9090/ >/dev/null && exit 0
            sleep 2
          done
          echo "S3Mock did not become ready" && exit 1

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pyright
        run: pyright

      - name: Apply migrations from zero
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Export OpenAPI contract
        run: python -m backend.scripts.export_openapi --output openapi.json

      - name: Run tests
        run: pytest
