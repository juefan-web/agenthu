name: Client checks

# Billing throttle (2026-10-03): PR pushes run once via pull_request; push
# triggers only main (client jobs run on windows-latest at a 2x minute
# multiplier, so the duplicate run was the most expensive one to keep).
# Docs-only changes skip CI entirely.
on:
  push:
    branches: [main]
    paths-ignore:
      - "AGENT_CONTEXT/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "AGENT_CONTEXT/**"
      - "**/*.md"

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  tauri-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
