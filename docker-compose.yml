name: agenthu

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agenthu
      POSTGRES_PASSWORD: agenthu
      POSTGRES_DB: agenthu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthu -d agenthu"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage. The bucket is created automatically by the
  # Backend at startup (S3Storage.ensure_bucket), so no separate setup service
  # is required. Override MINIO_IMAGE if your registry mirrors it elsewhere.
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: agenthu
      MINIO_ROOT_PASSWORD: agenthu123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Alternate S3-compatible storage for environments where the MinIO image is
  # unavailable. Enable with: docker compose --profile s3mock up -d db redis s3mock
  # and set S3_ENDPOINT_URL=http://localhost:9090.
  s3mock:
    image: adobe/s3mock:latest
    profiles: ["s3mock"]
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: agenthu
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: us-east-1
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /tmp/s3mock
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://agenthu:agenthu@db:5432/agenthu
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    command: >
      /bin/sh -c "alembic upgrade head &&
      uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./migrations:/app/migrations
      - ./tests:/app/tests
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://agenthu:agenthu@db:5432/agenthu
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    command: ["arq", "backend.worker.settings.WorkerSettings"]
    volumes:
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
